[package]
name = "nshtodo-native"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.5.0"
# SQLite compiled in (Android has no usable system one); the Db module keeps tasks and categories in it.
rusqlite = { version = "0.42", features = ["bundled"] }

# CoreLocation and the UIKit time picker through the objc2 family, on iOS (device and simulator) only.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDate", "NSError", "NSObject", "NSString", "NSTimeZone"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "UIColor", "UIControl", "UIDatePicker", "UIResponder", "UIView"] }
nsh-platform-ios = { version = "0.5.0", default-features = false }
serde_json = "1"
objc2-core-location = { version = "0.3", default-features = false, features = ["std", "CLLocation", "CLLocationManager", "CLLocationManagerDelegate", "CLError"] }
futures-channel = "0.3"
